apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: workloads
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      serviceAccountName: backstage
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: copy-assets
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          mkdir -p /store
          while read -r key dst; do
            case "$key" in ''|\#*) continue;; esac
            mkdir -p "/store/$(dirname "$dst")"
            cp "/cfg/$key" "/store/$dst"
          done < /cfg/layout
        volumeMounts:
        - name: backstage-templates
          mountPath: /cfg
        - name: templates-store
          mountPath: /store
      containers:
      - name: backstage
        image: docker.io/guslopezc/backstage:v12
        imagePullPolicy: Always
        ports:
        - containerPort: 7007
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: backstage-secrets
                key: GITHUB_TOKEN
          - name: AUTH_GITHUB_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: backstage-secrets
                key: AUTH_GITHUB_CLIENT_ID
          - name: AUTH_GITHUB_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: backstage-secrets
                key: AUTH_GITHUB_CLIENT_SECRET
          - name: POSTGRES_HOST
            value: postgres.workloads.svc.cluster.local
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: postgres-sealed
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-sealed
                key: POSTGRES_PASSWORD
          - name: NODE_OPTIONS
            value: "--no-node-snapshot"
        args:
          - node
          - packages/backend
          - --config
          - app-config.yaml
          - --config
          - app-config.production.yaml
          - --config
          - /app/config/override.yaml
        readinessProbe:
          httpGet:
            path: /
            port: 7007
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 7007
          initialDelaySeconds: 60
          periodSeconds: 15
        volumeMounts:
        - mountPath: /app/templates
          name: templates-store
        - mountPath: /app/plugins
          name: templates-store
        - mountPath: /app/config
          name: templates-store
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 1000m
      volumes:
      - name: backstage-templates
        configMap:
          name: backstage-templates
          defaultMode: 420
      - name: templates-store
        emptyDir: {}
