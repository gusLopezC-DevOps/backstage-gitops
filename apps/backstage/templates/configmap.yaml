  templates.python-fastapi.skeleton.app.main.py: |
    from fastapi import FastAPI
    
    app = FastAPI(title="${{ values.repoName }}", version="0.1.0")
    
    
    @app.get("/")
    def root() -> dict:
        return {"message": "Hello from ${{ values.repoName }}"}
    
    
    @app.get("/health")
    def health() -> dict:
        return {"status": "ok"}
  templates.python-fastapi.skeleton.app.requirements.txt: |
    fastapi==0.115.8
    uvicorn[standard]==0.34.0
  templates.k8s-manifests.template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: crossplane-local-deployment
      title: Crossplane Local Deployment
      description: Scaffold a Crossplane LocalDeployment claim that abstracts Deployment, Service, and Kong Ingress into a single resource
      tags:
        - crossplane
        - kubernetes
        - deployment
        - kong
        - golden-path
      annotations:
        github.com/project-slug: gusLopezC-DevOps/backstage-entities
    spec:
      owner: development
      type: service
      parameters:
        - title: Application Details
          properties:
            appName:
              title: Application Name
              type: string
              description: Name of the application (used for labels and resource names)
            image:
              title: Container Image
              type: string
              description: 'Docker image with semantic version tag (e.g., nginx:1.27-alpine). CRITICAL: Do not use :latest or Kyverno will reject it.'
            hostname:
              title: Hostname
              type: string
              description: Hostname for the ingress (e.g., myapp.local)
            port:
              title: Container Port
              type: number
              default: 80
              description: Port the container listens on
      steps:
        - id: fetch
          name: Fetch Crossplane Claim Template
          action: fetch:plain
          input:
            url: ./crossplane-skeleton
        - id: publish
          name: Push to Workloads Repo
          action: gitops:push-to-repo
          input:
            repoUrl: github.com?owner=gusLopezC-DevOps&repo=backstage-workloads
            branch: main
            gitCommitMessage: "Add LocalDeployment claim for ${{ parameters.appName }}"
            subPath: apps/workloads/${{ parameters.appName }}
            appName: ${{ parameters.appName }}
            image: ${{ parameters.image }}
            hostname: ${{ parameters.hostname }}
            port: ${{ parameters.port }}
        - id: register
          name: Register Component in Catalog
          action: catalog:register
          input:
            repoContentsUrl: https://github.com/gusLopezC-DevOps/backstage-workloads/blob/main
            catalogInfoPath: /apps/workloads/${{ parameters.appName }}/catalog-info.yaml
      output:
        links:
          - title: ArgoCD
            url: https://argocd.local/applications/${{ parameters.appName }}
          - title: Component in Catalog
            url: https://backstage.local/catalog/default/component/${{ parameters.appName }}
  templates.k8s-manifests.crossplane-skeleton.catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ appName }}
      description: A secure crossplane workload
      annotations:
        backstage.io/kubernetes-id: ${{ appName }}
        backstage.io/kubernetes-namespace: workloads
        kyverno.io/namespace: workloads
        kyverno.io/kind: Deployment,Pod
        kyverno.io/resource-name: ${{ appName }}
    spec:
      type: service
      lifecycle: experimental
      owner: development
      dependsOn:
        - resource:default/kubernetes-cluster
  templates.k8s-manifests.crossplane-skeleton.claim.yaml: |
    apiVersion: example.crossplane.io/v1alpha1
    kind: LocalDeployment
    metadata:
      name: ${{ appName }}
      namespace: workloads
      labels:
        backstage.io/kubernetes-id: ${{ appName }}
    spec:
      parameters:
        image: ${{ image }}
        hostname: ${{ hostname }}
        port: ${{ port }}
        replicas: 1
  templates.k8s-manifests.crossplane-skeleton.kustomization.yaml: |
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources:
      - claim.yaml
  plugins.custom-actions.cjs.js: |
    'use strict';
    
    const { createBackendModule } = require('@backstage/backend-plugin-api');
    const { scaffolderActionsExtensionPoint } = require('@backstage/plugin-scaffolder-node');
    const { createTemplateAction, cloneRepo, commitAndPushRepo, parseRepoUrl } = require('@backstage/plugin-scaffolder-node');
    const { ScmIntegrations, DefaultGithubCredentialsProvider } = require('@backstage/integration');
    const fs = require('fs-extra');
    const path = require('path');
    const os = require('os');
    const yaml = require('js-yaml');
    
    module.exports = createBackendModule({
      pluginId: 'scaffolder',
      moduleId: 'custom-gitops-push',
      register({ registerInit }) {
        registerInit({
          deps: {
            scaffolder: scaffolderActionsExtensionPoint,
            config: require('@backstage/backend-plugin-api').coreServices.rootConfig,
          },
          async init({ scaffolder, config }) {
            const integrations = ScmIntegrations.fromConfig(config);
            const githubCredentialsProvider = DefaultGithubCredentialsProvider.fromIntegrations(integrations);
    
            scaffolder.addActions(
              createTemplateAction({
                id: 'gitops:push-to-repo',
                description: 'Clones an existing repo, copies files from workspace to a subpath, commits, and pushes',
                schema: {
                  input: {
                    type: 'object',
                    required: ['repoUrl', 'subPath'],
                    properties: {
                      repoUrl: {
                        title: 'Repository Location',
                        type: 'string',
                        description: "Accepts format github.com?owner=owner&repo=repo",
                      },
                      branch: {
                        title: 'Branch',
                        type: 'string',
                        default: 'main',
                      },
                      gitCommitMessage: {
                        title: 'Commit Message',
                        type: 'string',
                      },
                      subPath: {
                        title: 'Subdirectory Path',
                        type: 'string',
                        description: "Path within the repo to place files (e.g. apps/workloads/my-app)",
                      },
                      appName: {
                        title: 'Application Name',
                        type: 'string',
                        description: 'Value to substitute for ${{ appName }} in template files',
                      },
                      image: {
                        title: 'Container Image',
                        type: 'string',
                        description: 'Value to substitute for ${{ image }} in template files',
                      },
                      hostname: {
                        title: 'Hostname',
                        type: 'string',
                        description: 'Value to substitute for ${{ hostname }} in template files',
                      },
                      port: {
                        title: 'Container Port',
                        type: 'number',
                        description: 'Value to substitute for ${{ port }} in template files',
                      },
                    },
                  },
                  output: {
                    type: 'object',
                    properties: {
                      commitHash: { title: 'Commit Hash', type: 'string' },
                    },
                  },
                },
                async handler(ctx) {
                  const { repoUrl, branch = 'main', gitCommitMessage, subPath } = ctx.input;
                  const { owner, repo, host } = parseRepoUrl(repoUrl, integrations);
                  const { token } = await githubCredentialsProvider.getCredentials({
                    url: `https://${host}/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,
                  });
                  if (!token) throw new Error(`No GitHub token available for ${host}/${owner}/${repo}`);
    
                  const auth = { username: 'x-access-token', password: token };
                  const authorInfo = { name: 'Backstage Scaffolder', email: 'scaffolder@backstage.io' };
                  const remoteUrl = `https://github.com/${owner}/${repo}.git`;
                  const tempDir = await fs.mkdtemp(path.join(os.tmpdir(), 'gitops-push-'));
    
                  ctx.logger.info(`Cloning ${remoteUrl} to ${tempDir}`);
                  try {
                    await cloneRepo({ url: remoteUrl, dir: tempDir, auth, logger: ctx.logger, ref: branch, depth: 1 });
                  } catch (ex) {
                    ctx.logger.error(`Clone failed: ${ex.message}`);
                    throw ex;
                  }
    
                  const targetDir = path.join(tempDir, subPath);
                  await fs.ensureDir(targetDir);
    
                  ctx.logger.info(`Copying files from ${ctx.workspacePath} to ${targetDir}`);
                  await fs.copy(ctx.workspacePath, targetDir, {
                    filter: (src) => {
                      const base = path.basename(src);
                      return base !== '.git' && base !== 'node_modules';
                    },
                  });
    
                  ctx.logger.info(`Substituting template variables in ${targetDir}`);
                  const substitutions = {
                    appName: ctx.input.appName,
                    image: ctx.input.image,
                    hostname: ctx.input.hostname,
                    port: ctx.input.port,
                  };
                  function walkDir(dir) {
                    const entries = fs.readdirSync(dir, { withFileTypes: true });
                    for (const entry of entries) {
                      const fullPath = path.join(dir, entry.name);
                      if (entry.isDirectory()) {
                        walkDir(fullPath);
                      } else if (entry.isFile() && /\.(yaml|yml|json)$/i.test(entry.name)) {
                        let content = fs.readFileSync(fullPath, 'utf8');
                        let modified = false;
                        for (const [key, value] of Object.entries(substitutions)) {
                          if (value !== undefined) {
                            const regex = new RegExp(`\\$\\{\\{\\s*${key}\\s*(\\|\\s*default\\([^)]+\\))?\\s*}}`, 'g');
                            const newContent = content.replace(regex, String(value));
                            if (newContent !== content) {
                              content = newContent;
                              modified = true;
                            }
                          }
                        }
                        if (modified) {
                          ctx.logger.info(`  Substituted in ${entry.name}`);
                          fs.writeFileSync(fullPath, content, 'utf8');
                        }
                      }
                    }
                  }
                  walkDir(targetDir);
    
                  ctx.logger.info(`Updating root kustomization.yaml to include ${subPath}`);
                  const rootKustPath = path.join(tempDir, 'kustomization.yaml');
                  const rootKustContent = fs.readFileSync(rootKustPath, 'utf8');
                  const rootKust = yaml.load(rootKustContent);
                  if (!rootKust.resources.includes(subPath)) {
                    rootKust.resources.push(subPath);
                  }
                  fs.writeFileSync(rootKustPath, yaml.dump(rootKust));
    
                  const result = await commitAndPushRepo({
                    dir: tempDir, auth, logger: ctx.logger,
                    commitMessage: gitCommitMessage || `Add files to ${subPath}`,
                    gitAuthorInfo: authorInfo, branch,
                  });
    
                  await fs.remove(tempDir).catch(() => {});
                  ctx.output('commitHash', result.commitHash);
                },
              })
            );
          },
        });
      },
    });
