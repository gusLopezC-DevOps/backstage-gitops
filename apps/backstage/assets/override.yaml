kubernetes:
  customResources:
    - group: 'wgpolicyk8s.io'
      apiVersion: 'v1alpha2'
      plural: 'policyreports'
    - group: 'example.crossplane.io'
      apiVersion: 'v1alpha1'
      plural: 'localdeployments'

kyverno:
  enablePermissions: false

kubernetesResources:
  enablePermissions: true
  annotationPrefix: terasky.backstage.io
  concurrency: 10

auth:
  providers: {}

proxy:
  endpoints:
    /opencost:
      target: http://opencost.opencost.svc.cluster.local:9003
      changeOrigin: true

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

catalog:
  locations:
    # Local entity files
    - type: file
      target: /app/entities/users.yaml
      rules:
        - allow: [User]

    - type: file
      target: /app/entities/groups.yaml
      rules:
        - allow: [Group]

    # Local software templates
    - type: file
      target: /app/templates/python-fastapi/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: /app/templates/k8s-manifests/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: /app/templates/go-frontend/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: /app/templates/go-api/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: /app/templates/node-api/template.yaml
      rules:
        - allow: [Template]

    - type: file
      target: /app/templates/job-argo/template.yaml
      rules:
        - allow: [Template]

    # MLOps templates (source of truth: control-plane repo)
    - type: url
      target: https://github.com/gusLopezC-DevOps/control-plane/blob/main/backstage-templates/cognitive-safe-llm-service/template.yaml
      rules:
        - allow: [Template]

    - type: url
      target: https://github.com/gusLopezC-DevOps/control-plane/blob/main/backstage-templates/llm-canary-eval-pipeline/template.yaml
      rules:
        - allow: [Template]

    - type: url
      target: https://github.com/gusLopezC-DevOps/control-plane/blob/main/backstage-templates/finops-arbitrage-router/template.yaml
      rules:
        - allow: [Template]
