apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ repoName }}
  namespace: ${{ repoName }}
  labels:
    app: ${{ repoName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ repoName }}
  template:
    metadata:
      labels:
        app: ${{ repoName }}
    spec:
      containers:
        - name: app
          image: docker.io/guslopezc/${{ repoName }}:ci
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi