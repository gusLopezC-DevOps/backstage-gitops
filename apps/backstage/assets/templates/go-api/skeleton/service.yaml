apiVersion: v1
kind: Service
metadata:
  name: ${{ values.repoName }}
  namespace: ${{ values.repoName }}
  labels:
    app: ${{ values.repoName }}
    backstage.io/kubernetes-id: ${{ values.repoName }}
spec:
  selector:
    app: ${{ values.repoName }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080