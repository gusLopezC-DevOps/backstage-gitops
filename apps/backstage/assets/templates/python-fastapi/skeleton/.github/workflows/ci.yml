name: ci

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login registry
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ secrets.DOCKER_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKER_PASSWORD }}' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: docker.io/guslopezc/${{ values.repoName }}:${{ '${{ github.sha }}' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Actualizar imagen del manifest (dispara sync de Argo)
        run: |
          sed -i "s#image: docker.io/guslopezc/.*#image: docker.io/guslopezc/${{ values.repoName }}:$GITHUB_SHA#" deployment.yaml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add deployment.yaml
          if git diff --cached --quiet; then
            echo 'imagen sin cambios'
          else
            git commit -m 'ci: bump imagen' && git push
          fi