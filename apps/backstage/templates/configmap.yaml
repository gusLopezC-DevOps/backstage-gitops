apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-templates
  namespace: workloads
data:
  override.yaml: |
    kubernetes:
      customResources:
        - group: 'wgpolicyk8s.io'
          apiVersion: 'v1alpha2'
          plural: 'policyreports'
        - group: 'example.crossplane.io'
          apiVersion: 'v1alpha1'
          plural: 'localdeployments'
    
    kyverno:
      enablePermissions: false
    
    kubernetesResources:
      enablePermissions: true
      annotationPrefix: terasky.backstage.io
      concurrency: 10
    
    auth:
      providers:
        guest:
          dangerouslyAllowOutsideDevelopment: true
    
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}
    
    catalog:
      locations:
        # Local entity files
        - type: file
          target: /app/entities/users.yaml
          rules:
            - allow: [User]
    
        - type: file
          target: /app/entities/groups.yaml
          rules:
            - allow: [Group]
    
        # Local software templates
        - type: file
          target: /app/templates/python-fastapi/template.yaml
          rules:
            - allow: [Template]
    
        - type: file
          target: /app/templates/k8s-manifests/template.yaml
          rules:
            - allow: [Template]
    
        - type: file
          target: /app/templates/go-frontend/template.yaml
          rules:
            - allow: [Template]
  templates.go-frontend.template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: go-frontend
      title: Go Frontend Service
      description: Crea un servicio frontend en Go (servidor statico + health) que se despliega y registra en Argo CD de forma automatica (PR al plano de control + root-app)
      tags:
        - go
        - golang
        - frontend
        - docker
        - argocd
      annotations:
        github.com/project-slug: gusLopezC-DevOps/backstage-entities
    spec:
      owner: development
      type: service
      parameters:
        - title: Proyecto
          required:
            - repoName
            - description
          properties:
            repoName:
              title: Nombre del workload (repo + namespace + AppProject + Application)
              type: string
              description: 'Minusculas y guiones. Ej: mi-front'
            description:
              title: Descripcion
              type: string
            grupo:
              title: Grupo / equipo propietario
              type: string
              description: 'Ej: development'
              default: development
      steps:
        - id: fetch
          name: Scaffold del repositorio
          action: fetch:template
          input:
            url: ./skeleton
            targetPath: ./workload
            values:
              repoName: ${{ parameters.repoName }}
              description: ${{ parameters.description }}
              grupo: ${{ parameters.grupo }}
        - id: publish
          name: Crear repositorio en GitHub
          action: publish:github
          input:
            repoUrl: github.com?owner=gusLopezC-DevOps&repo=${{ parameters.repoName }}
            repoVisibility: public
            defaultBranch: main
            sourcePath: workload
            description: ${{ parameters.description }}
            gitCommitMessage: Initial scaffold from Backstage + Argo CD
        - id: alta
          name: Registrar workload en el plano de control (PR)
          action: github:actions:dispatch
          input:
            repoUrl: github.com?owner=gusLopezC-DevOps&repo=control-plane
            workflowId: workflow-alta-pr.yml
            branchOrTagName: main
            workflowInputs:
              nombre: ${{ parameters.repoName }}
              repositorio: https://github.com/gusLopezC-DevOps/${{ parameters.repoName }}.git
              grupo: ${{ parameters.grupo }}
              arquetipo: stateless
        - id: register
          name: Registrar en el catalogo Backstage
          action: catalog:register
          input:
            catalogInfoUrl: https://raw.githubusercontent.com/gusLopezC-DevOps/${{ parameters.repoName }}/main/catalog-info.yaml
      output:
        links:
          - title: Repositorio
            url: ${{ steps.publish.output.remoteUrl }}
          - title: PR en el plano de control
            url: https://github.com/gusLopezC-DevOps/control-plane/pulls
          - title: ArgoCD
            url: https://argocd.local/applications/${{ parameters.repoName }}
          - title: Catalogo Backstage
            url: https://backstage.local/catalog/default/component/${{ parameters.repoName }}
  templates.go-frontend.skeleton..dockerignore: |
    .git
    .gitignore
    .github
    Dockerfile
    README.md
    # public/ se copia explicitamente al image
  templates.go-frontend.skeleton.Dockerfile: |
    FROM golang:1.22-alpine AS build
    WORKDIR /src
    COPY go.mod ./
    RUN go mod download
    COPY . .
    RUN CGO_ENABLED=0 GOOS=linux go build -o /app/frontend .
    
    FROM gcr.io/distroless/static-debian12
    WORKDIR /workdir
    COPY --from=build /app/frontend .
    COPY public/ ./public/
    EXPOSE 8080
    ENTRYPOINT ["/workdir/frontend"]
  templates.go-frontend.skeleton.README.md: |
    # ${{ values.repoName }}
    
    Frontend en Go desplegado por Argo CD.
    
    - Imagen: `docker.io/guslopezc/${{ values.repoName }}`
    - Namespace / AppProject / Application: `${{ values.repoName }}`
    - Ingress: `https://${{ values.repoName }}.local`
    
    ## Local
    
    ```bash
    go run .
    ```
    
    Servidor stdlib que sirve `public/` (SPA) y expone `/health` en el puerto `PORT` (defecto 8080).
    
    ## CI
    
    `.github/workflows/ci.yml` construye y publica la imagen y actualiza la tag en
    `deployment.yaml`; Argo CD (sync automatico con selfHeal) desplega el cambio.
  templates.go-frontend.skeleton.catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ values.repoName }}
      description: ${{ values.description }}
      annotations:
        github.com/project-slug: gusLopezC-DevOps/${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
        backstage.io/kubernetes-namespace: ${{ values.repoName }}
        backstage.io/techdocs-ref: url:https://github.com/gusLopezC-DevOps/${{ values.repoName }}/tree/main
    spec:
      type: website
      lifecycle: production
      owner: group:default/${{ values.grupo }}
  templates.go-frontend.skeleton.deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${{ values.repoName }}
      namespace: ${{ values.repoName }}
      labels:
        app: ${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${{ values.repoName }}
      template:
        metadata:
          labels:
            app: ${{ values.repoName }}
            backstage.io/kubernetes-id: ${{ values.repoName }}
        spec:
          containers:
            - name: app
              image: docker.io/guslopezc/${{ values.repoName }}:ci
              ports:
                - containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8080
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8080
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 96Mi
  templates.go-frontend.skeleton.go.mod: |
    module github.com/gusLopezC-DevOps/${{ values.repoName }}
    
    go 1.22
  templates.go-frontend.skeleton.ingress.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${{ values.repoName }}
      namespace: ${{ values.repoName }}
      labels:
        app: ${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
    spec:
      ingressClassName: kong
      rules:
        - host: ${{ values.repoName }}.local
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ values.repoName }}
                    port:
                      name: http
  templates.go-frontend.skeleton.main.go: |
    package main
    
    import (
    	"log"
    	"net/http"
    	"os"
    )
    
    func health(w http.ResponseWriter, r *http.Request) {
    	w.Header().Set("Content-Type", "application/json")
    	w.Write([]byte(`{"status":"ok"}`))
    }
    
    func main() {
    	port := os.Getenv("PORT")
    	if port == "" {
    		port = "8080"
    	}
    
    	http.Handle("/", http.FileServer(http.Dir("./public")))
    	http.HandleFunc("/health", health)
    
    	log.Printf("frontend ${{ values.repoName }} escuchando en :%s", port)
    	if err := http.ListenAndServe(":"+port, nil); err != nil {
    		log.Fatal(err)
    	}
    }
  templates.go-frontend.skeleton.mkdocs.yml: |
    site_name: ${{ values.repoName }}
    repo_url: https://github.com/gusLopezC-DevOps/${{ values.repoName }}
    nav:
      - Inicio: index.md
  templates.go-frontend.skeleton.service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: ${{ values.repoName }}
      namespace: ${{ values.repoName }}
      labels:
        app: ${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
    spec:
      selector:
        app: ${{ values.repoName }}
      ports:
        - name: http
          port: 8080
          targetPort: 8080
  templates.go-frontend.skeleton.docs.index.md: |
    # ${{ values.repoName }}
    
    Frontend en Go desplegado por Argo CD.
    
    - Imagen: `docker.io/guslopezc/${{ values.repoName }}`
    - Namespace / AppProject / Application: `${{ values.repoName }}`
    - Ingress: `https://${{ values.repoName }}.local`
    
    ## Health
    
    ```bash
    curl https://${{ values.repoName }}.local/health
    ```
    
    Documentación generada con TechDocs a partir de este repositorio.
  templates.go-frontend.skeleton.public.index.html: |
    <!DOCTYPE html>
    <html lang="es">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>${{ values.repoName }}</title>
      <style>
        body { font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
        h1 { font-weight: 600; }
        .ok { color: #34d399; }
      </style>
    </head>
    <body>
      <main>
        <h1>${{ values.repoName }}</h1>
        <p>Frontend en Go sirviéndose desde <code>public/</code>.</p>
        <p class="ok">Health: <a href="/health">/health</a></p>
      </main>
    </body>
    </html>
  templates.go-frontend.skeleton..github.workflows.ci.yml: |
    name: ci
    
    on:
      push:
        branches: [main]
    
    permissions:
      contents: write
    
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
    
          - uses: actions/setup-go@v5
            with:
              go-version-file: go.mod
    
          - name: Test
            run: go vet ./... && go build ./...
    
          - uses: docker/setup-buildx-action@v3
    
          - name: Login registry
            uses: docker/login-action@v3
            with:
              username: ${{ '${{ secrets.DOCKER_USERNAME }}' }}
              password: ${{ '${{ secrets.DOCKER_PASSWORD }}' }}
    
          - name: Build and push
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: docker.io/guslopezc/${{ values.repoName }}:${{ '${{ github.sha }}' }}
              cache-from: type=gha
              cache-to: type=gha,mode=max
    
          - name: Actualizar imagen del manifest (dispara sync de Argo)
            run: |
              sed -i "s#image: docker.io/guslopezc/.*#image: docker.io/guslopezc/${{ values.repoName }}:$GITHUB_SHA#" deployment.yaml
              git config user.name 'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              git add deployment.yaml
              if git diff --cached --quiet; then
                echo 'imagen sin cambios'
              else
                git commit -m 'ci: bump imagen' && git push
              fi
  templates.python-fastapi.template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: python-fastapi
      title: Python FastAPI Microservice
      description: Crea un microservicio Python/FastAPI que se despliega y registra en Argo CD de forma automatica (PR al plano de control + root-app)
      tags:
        - python
        - fastapi
        - docker
        - argocd
      annotations:
        github.com/project-slug: gusLopezC-DevOps/backstage-entities
    spec:
      owner: development
      type: service
      parameters:
        - title: Proyecto
          required:
            - repoName
            - description
          properties:
            repoName:
              title: Nombre del workload (repo + namespace + AppProject + Application)
              type: string
              description: 'Minusculas y guiones. Ej: mi-api'
            description:
              title: Descripcion
              type: string
            grupo:
              title: Grupo / equipo propietario
              type: string
              description: 'Ej: development'
              default: development
      steps:
        - id: fetch
          name: Scaffold del repositorio
          action: fetch:template
          input:
            url: ./skeleton
            targetPath: ./workload
            values:
              repoName: ${{ parameters.repoName }}
              description: ${{ parameters.description }}
              grupo: ${{ parameters.grupo }}
        - id: limpiar
          name: Limpiar residuos del skeleton
          action: fs:delete
          input:
            files:
              - workload/.github/workflows/ci-cd.yaml
              - workload/main.py
              - workload/requirements.txt
        - id: publish
          name: Crear repositorio en GitHub
          action: publish:github
          input:
            repoUrl: github.com?owner=gusLopezC-DevOps&repo=${{ parameters.repoName }}
            repoVisibility: public
            defaultBranch: main
            sourcePath: workload
            description: ${{ parameters.description }}
            gitCommitMessage: Initial scaffold from Backstage + Argo CD
        - id: alta
          name: Registrar workload en el plano de control (PR)
          action: github:actions:dispatch
          input:
            repoUrl: github.com?owner=gusLopezC-DevOps&repo=control-plane
            workflowId: workflow-alta-pr.yml
            branchOrTagName: main
            workflowInputs:
              nombre: ${{ parameters.repoName }}
              repositorio: https://github.com/gusLopezC-DevOps/${{ parameters.repoName }}.git
              grupo: ${{ parameters.grupo }}
              arquetipo: stateless
        - id: register
          name: Registrar en el catalogo Backstage
          action: catalog:register
          input:
            catalogInfoUrl: https://raw.githubusercontent.com/gusLopezC-DevOps/${{ parameters.repoName }}/main/catalog-info.yaml
      output:
        links:
          - title: Repositorio
            url: ${{ steps.publish.output.remoteUrl }}
          - title: PR en el plano de control
            url: https://github.com/gusLopezC-DevOps/control-plane/pulls
          - title: ArgoCD
            url: https://argocd.local/applications/${{ parameters.repoName }}
          - title: Catalogo Backstage
            url: https://backstage.local/catalog/default/component/${{ parameters.repoName }}
  templates.python-fastapi.skeleton.Dockerfile: |
    FROM python:3.12-slim
    
    WORKDIR /app
    COPY app/requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY app/ .
    
    EXPOSE 8000
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  templates.python-fastapi.skeleton.README.md: |
    # ${{ values.repoName }}
    
    Microservicio Python/FastAPI desplegado por Argo CD.
    
    - Imagen: `docker.io/guslopezc/${{ values.repoName }}`
    - Namespace / AppProject / Application: `${{ values.repoName }}`
    - Ingress: `https://${{ values.repoName }}.local`
    
    ## Local
    
    ```bash
    pip install -r app/requirements.txt
    uvicorn app.main:app --reload --port 8000
    ```
    
    ## CI
    
    `.github/workflows/ci.yml` construye y publica la imagen y actualiza la tag en
    `deployment.yaml`; Argo CD (sync automatico con selfHeal) desplega el cambio.
  templates.python-fastapi.skeleton.catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ values.repoName }}
      description: ${{ values.description }}
      annotations:
        github.com/project-slug: gusLopezC-DevOps/${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
        backstage.io/kubernetes-namespace: ${{ values.repoName }}
        backstage.io/techdocs-ref: url:https://github.com/gusLopezC-DevOps/${{ values.repoName }}/tree/main
    spec:
      type: service
      lifecycle: production
      owner: group:default/${{ values.grupo }}
  templates.python-fastapi.skeleton.deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${{ values.repoName }}
      namespace: ${{ values.repoName }}
      labels:
        app: ${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${{ values.repoName }}
      template:
        metadata:
          labels:
            app: ${{ values.repoName }}
            backstage.io/kubernetes-id: ${{ values.repoName }}
        spec:
          containers:
            - name: app
              image: docker.io/guslopezc/${{ values.repoName }}:ci
              ports:
                - containerPort: 8000
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8000
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
  templates.python-fastapi.skeleton.ingress.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${{ values.repoName }}
