apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-python-fastapi-template
  namespace: workloads
data:
  skeleton..github.workflows.ci.yml: |
    name: ci
    
    on:
      push:
        branches: [main]
    
    permissions:
      contents: write
    
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
    
          - uses: docker/setup-buildx-action@v3
    
          - name: Login registry
            uses: docker/login-action@v3
            with:
              username: ${{ '${{ secrets.DOCKER_USERNAME }}' }}
              password: ${{ '${{ secrets.DOCKER_PASSWORD }}' }}
    
          - name: Build and push
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: docker.io/guslopezc/${{ parameters.repoName }}:${{ '${{ github.sha }}' }}
              cache-from: type=gha
              cache-to: type=gha,mode=max
    
          - name: Actualizar imagen del manifest (dispara sync de Argo)
            run: |
              sed -i 's#image: docker.io/guslopezc/.*#image: docker.io/guslopezc/${{ parameters.repoName }}:$GITHUB_SHA#' deployment.yaml
              git config user.name 'github-actions[bot]'
              git config user.email 'github-actions[bot]@users.noreply.github.com'
              git add deployment.yaml
              if git diff --cached --quiet; then
                echo 'imagen sin cambios'
              else
                git commit -m 'ci: bump imagen' && git push
              fi
  skeleton.Dockerfile: |
    FROM python:3.12-slim
    
    WORKDIR /app
    COPY app/requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY app/ .
    
    EXPOSE 8000
    CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
  skeleton.README.md: |
    # ${{ parameters.repoName }}
    
    Microservicio Python/FastAPI desplegado por Argo CD.
    
    - Imagen: `docker.io/guslopezc/${{ parameters.repoName }}`
    - Namespace / AppProject / Application: `${{ parameters.repoName }}`
    - Ingress: `https://${{ parameters.repoName }}.local`
    
    ## Local
    
    ```bash
    pip install -r app/requirements.txt
    uvicorn app.main:app --reload --port 8000
    ```
    
    ## CI
    
    `.github/workflows/ci.yml` construye y publica la imagen y actualiza la tag en
    `deployment.yaml`; Argo CD (sync automatico con selfHeal) desplega el cambio.
  skeleton.app.main.py: |
    from fastapi import FastAPI
    
    app = FastAPI(title="${{ parameters.repoName }}", version="0.1.0")
    
    
    @app.get("/")
    def root() -> dict:
        return {"message": "Hello from ${{ parameters.repoName }}"}
    
    
    @app.get("/health")
    def health() -> dict:
        return {"status": "ok"}
  skeleton.app.requirements.txt: |
    fastapi==0.115.8
    uvicorn[standard]==0.34.0
  skeleton.catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ${{ parameters.repoName }}
      description: ${{ parameters.description }}
      annotations:
        github.com/project-slug: gusLopezC-DevOps/${{ parameters.repoName }}
        backstage.io/kubernetes-id: ${{ parameters.repoName }}
        backstage.io/techdocs-ref: dir:.
    spec:
      type: service
      lifecycle: production
      owner: group:default/${{ parameters.grupo }}
  skeleton.deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${{ parameters.repoName }}
      namespace: ${{ parameters.repoName }}
      labels:
        app: ${{ parameters.repoName }}
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ${{ parameters.repoName }}
      template:
        metadata:
          labels:
            app: ${{ parameters.repoName }}
        spec:
          containers:
            - name: app
              image: docker.io/guslopezc/${{ parameters.repoName }}:ci
              ports:
                - containerPort: 8000
              readinessProbe:
                httpGet:
                  path: /health
                  port: 8000
              livenessProbe:
                httpGet:
                  path: /health
                  port: 8000
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
  skeleton.ingress.yaml: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: ${{ parameters.repoName }}
      namespace: ${{ parameters.repoName }}
    spec:
      ingressClassName: kong
      rules:
        - host: ${{ parameters.repoName }}.local
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: ${{ parameters.repoName }}
                    port:
                      name: http
  skeleton.mkdocs.yml: |
    site_name: ${{ parameters.repoName }}
    repo_url: https://github.com/gusLopezC-DevOps/${{ parameters.repoName }}
    nav:
      - Inicio: index.md
  skeleton.service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: ${{ parameters.repoName }}
      namespace: ${{ parameters.repoName }}
    spec:
      selector:
        app: ${{ parameters.repoName }}
      ports:
        - name: http
          port: 8000
          targetPort: 8000
  template.yaml: |
    apiVersion: scaffolder.backstage.io/v1beta3
    kind: Template
    metadata:
      name: python-fastapi
      title: Python FastAPI Microservice
      description: Crea un microservicio Python/FastAPI que se despliega y registra en Argo CD de forma automatica (PR al plano de control + root-app)
      tags:
        - python
        - fastapi
        - docker
        - argocd
      annotations:
        github.com/project-slug: gusLopezC-DevOps/backstage-entities
    spec:
      owner: development
      type: service
      parameters:
        - title: Proyecto
          required:
            - repoName
            - description
          properties:
            repoName:
              title: Nombre del workload (repo + namespace + AppProject + Application)
              type: string
              description: 'Minusculas y guiones. Ej: mi-api'
            description:
              title: Descripcion
              type: string
            grupo:
              title: Grupo / equipo propietario
              type: string
              description: 'Ej: dev'
              default: dev
      steps:
        - id: fetch
          name: Scaffold del repositorio
          action: fetch:template
          input:
            url: ./skeleton
            targetPath: ./workload
            values:
              repoName: ${{ parameters.repoName }}
              description: ${{ parameters.description }}
              grupo: ${{ parameters.grupo }}
        - id: publish
          name: Crear repositorio en GitHub
          action: publish:github
          input:
            repoUrl: https://github.com/gusLopezC-DevOps
            repoName: ${{ parameters.repoName }}
            defaultBranch: main
            sourcePath: workload
            description: ${{ parameters.description }}
            gitCommitMessage: Initial scaffold from Backstage + Argo CD
        - id: alta
          name: Registrar workload en el plano de control (PR)
          action: github:actions:dispatch
          input:
            repoUrl: github.com?owner=gusLopezC-DevOps&repo=control-plane
            workflowId: alta-pr.yml
            branchReference: main
            workflowInputs:
              nombre: ${{ parameters.repoName }}
              repositorio: https://github.com/gusLopezC-DevOps/${{ parameters.repoName }}.git
              grupo: ${{ parameters.grupo }}
              arquetipo: stateless
        - id: register
          name: Registrar en el catalogo Backstage
          action: catalog:register
          input:
            repoContentsUrl: https://github.com/gusLopezC-DevOps/${{ parameters.repoName }}/blob/main
            catalogInfoPath: catalog-info.yaml
      output:
        links:
          - title: Repositorio
            url: ${{ steps.publish.output.remoteUrl }}
          - title: PR en el plano de control
            url: https://github.com/gusLopezC-DevOps/control-plane/pulls
          - title: ArgoCD
            url: https://argocd.local/applications/${{ parameters.repoName }}
          - title: Catalogo Backstage
            url: https://backstage.local/catalog/default/component/${{ parameters.repoName }}
