                    name: ${{ values.repoName }}
                    port:
                      name: http
  templates.python-fastapi.skeleton.mkdocs.yml: |
    site_name: ${{ values.repoName }}
    repo_url: https://github.com/gusLopezC-DevOps/${{ values.repoName }}
    nav:
      - Inicio: index.md
  templates.python-fastapi.skeleton.service.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: ${{ values.repoName }}
      namespace: ${{ values.repoName }}
      labels:
        app: ${{ values.repoName }}
        backstage.io/kubernetes-id: ${{ values.repoName }}
    spec:
      selector:
        app: ${{ values.repoName }}
      ports:
        - name: http
          port: 8000
          targetPort: 8000
  templates.python-fastapi.skeleton.docs.index.md: |
    # ${{ values.repoName }}
    
    Microservicio Python/FastAPI desplegado por Argo CD.
    
    - Imagen: `docker.io/guslopezc/${{ values.repoName }}`
    - Namespace / AppProject / Application: `${{ values.repoName }}`
    - Ingress: `https://${{ values.repoName }}.local`
    
    ## Health
    
    ```bash
    curl https://${{ values.repoName }}.local/health
    ```
    
    Documentación generada con TechDocs a partir de este repositorio.
  templates.python-fastapi.skeleton..github.workflows.ci.yml: |
    name: ci
    
    on:
      push:
        branches: [main]
    
    permissions:
      contents: write
    
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
    
          - uses: docker/setup-buildx-action@v3
    
          - name: Login registry
            uses: docker/login-action@v3
            with:
              username: ${{ '${{ secrets.DOCKER_USERNAME }}' }}
